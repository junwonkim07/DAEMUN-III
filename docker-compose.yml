# Production stack for a single VPS. Copy .env.example → .env first.
#
#   docker compose up -d --build
#
# Caddy terminates TLS and routes:
#   https://$WEB_DOMAIN        → web   (public site)
#   https://$API_DOMAIN        → api   (auth, admin CRUD, uploads — for the admin frontend)

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daemun}
      POSTGRES_USER: ${POSTGRES_USER:-daemun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daemun} -d ${POSTGRES_DB:-daemun}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-daemun}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-daemun}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      ADMIN_URL: https://${API_DOMAIN}
      WEB_URL: http://web:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET in .env}
      UPLOAD_DIR: /data/uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
    volumes:
      - ./data/uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # API when running on a bare IP (API_DOMAIN=http://<ip>:8080)
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?set WEB_DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on:
      - web
      - api
