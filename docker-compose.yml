# Production stack for a single VPS. Copy .env.example → .env first.
#
#   docker compose up -d --build
#
# Caddy terminates TLS and routes:
#   $WEB_DOMAIN    → web    (public site)
#   $ADMIN_DOMAIN  → admin  (admin panel; proxies /api and /uploads to api itself)
#   $API_DOMAIN    → api    (direct API access, e.g. for scripts)

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daemun}
      POSTGRES_USER: ${POSTGRES_USER:-daemun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daemun} -d ${POSTGRES_DB:-daemun}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-daemun}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-daemun}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      # Origin the admin frontend is served from (better-auth baseURL + trustedOrigins)
      ADMIN_URL: ${ADMIN_URL:?set ADMIN_URL in .env}
      WEB_URL: http://web:3000
      # Browser-facing origin of the public site (trustedOrigins + links in
      # verification / password-reset emails). Must match WEB_DOMAIN.
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://104.36.69.86}
      # 안내 챗봇. GEMINI_API_KEY 없으면 위젯은 "설정 안 됨" 안내만 한다.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Outgoing mail for delegate sign-up. Leave SMTP_HOST empty to log links instead.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-DAEMUN III <no-reply@daemun.local>}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET in .env}
      UPLOAD_DIR: /data/uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
    volumes:
      - ./data/uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000 # rewrites are fixed at build time
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        API_URL: http://api:4000 # rewrites are fixed at build time
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # API when running on a bare IP (API_DOMAIN=http://<ip>:8080)
      - "8081:8081" # admin when running on a bare IP (ADMIN_DOMAIN=http://<ip>:8081)
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?set WEB_DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on:
      - web
      - admin
      - api
