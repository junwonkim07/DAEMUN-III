name: Deploy

# main 머지 → Vercel 프로덕션 배포 (api → web → admin 순서).
#
# 리포지토리 시크릿 하나가 필요하다: VERCEL_TOKEN (Vercel → Account Settings →
# Tokens, scope junwon-9966). 없으면 잡은 안내만 찍고 성공으로 끝난다 — 토큰
# 누락이 빨간 빌드로 보이지 않게. 프로젝트 id 는 비밀이 아니다.
#
# Vercel GitHub 연동을 붙이면 Vercel 이 push 마다 스스로 배포하므로 이 워크플로우는
# 중복이 된다 — 그때는 이 파일을 지울 것 (안 지우면 머지마다 두 번 배포).
#
# API 프로덕션 빌드는 번들 전에 마이그레이션을 적용한다
# (apps/api/scripts/vercel-build.mjs). 그래서 api 가 먼저다.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: gTppgLrKg0MLvOqwJCifhsLG

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - app: api
            project: prj_FmZfoVxUw3EsjQdxdRGlqe0we9mG
          - app: web
            project: prj_Ys8jDG3efelEigAoVU4cnZd3u3iX
          - app: admin
            project: prj_yzVrYjzLj2PhPnlAfvBvyo2IyWZ5
    steps:
      - name: Check for VERCEL_TOKEN
        id: token
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          echo "present=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::VERCEL_TOKEN 시크릿이 없어 ${{ matrix.app }} 배포를 건너뜁니다. Settings → Secrets 에 추가하거나 Vercel GitHub 연동을 붙이세요."
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      # 레포 루트에서 올려야 프로젝트의 Root Directory(apps/<app>)가 그 안에서 잡힌다.
      - name: Deploy ${{ matrix.app }} to production
        if: steps.token.outputs.present == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ matrix.project }}
        run: npx --yes vercel@59 deploy --prod --yes --token="$VERCEL_TOKEN"
