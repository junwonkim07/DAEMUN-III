name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node so its store cache can be used
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck

      - run: pnpm -r lint

      # next.config.ts refuses a production build without API_URL (it is baked
      # into rewrites, and a silent localhost fallback used to reach deploys).
      # This build is a smoke check whose output is never deployed, so give it
      # an address that can never resolve rather than one that looks real.
      - run: pnpm -r build
        env:
          API_URL: http://api.invalid
